plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// Shared setup for every mod in mods/. Per-mod values (mod_id, mod_name, mod_version,
// mod_description) come from mods/<id>/gradle.properties.
subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	group = rootProject.maven_group
	version = project.mod_version
	base.archivesName = project.mod_id

	loom {
		splitEnvironmentSourceSets()

		mods {
			"${project.mod_id}" {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	// Server game tests + JUnit. Test mod lives in src/gametest.
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "${project.mod_id}-test"
			enableGameTests = true
			enableClientGameTests = false
			eula = true // Accepts the Minecraft EULA for the test server (Huy already accepted it as a player).
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

		testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
	}

	test {
		useJUnitPlatform()
	}

	processResources {
		inputs.property 'version', project.version
		filesMatching('fabric.mod.json') {
			expand 'version': project.version,
				'mod_id': project.mod_id,
				'mod_name': project.mod_name,
				'mod_description': project.mod_description
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = 25
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}
