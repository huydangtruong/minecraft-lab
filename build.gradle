plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// Shared setup for every mod in mods/. Per-mod values (mod_id, mod_name, mod_version,
// mod_description) come from mods/<id>/gradle.properties.
subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	group = rootProject.maven_group
	version = project.mod_version
	base.archivesName = project.findProperty('mod_file') ?: project.mod_id

	loom {
		splitEnvironmentSourceSets()

		mods {
			"${project.mod_id}" {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	// Server game tests + JUnit. Test mod lives in src/gametest.
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "${project.mod_id}-test"
			enableGameTests = true
			enableClientGameTests = true
			eula = true // Accepts the Minecraft EULA for the test server (Huy already accepted it as a player).
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

		testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
	}

	test {
		useJUnitPlatform()
	}

	// Run only some server game tests: ./gradlew :<id>:runGameTest -Pgt='<namespace>:<prefix>*' (fabric-api.gametest.filter,
	// a vanilla test selector). See docs/workflow/team.md "Test theo phạm vi thay đổi".
	tasks.matching { it.name == 'runGameTest' }.configureEach {
		if (project.hasProperty('gt')) {
			jvmArgs "-Dfabric-api.gametest.filter=${project.property('gt')}"
		}
	}

	// The dev client (runClient) starts muted: Huy may be playing or asleep while agents test. Client game tests are
	// muted by a mixin in the test mod (src/gametest).
	tasks.matching { it.name == 'runClient' }.configureEach {
		doFirst {
			def f = project.file('run/options.txt')
			f.parentFile.mkdirs()
			def lines = f.exists() ? f.readLines().findAll { !it.startsWith('soundCategory_master:') } : []
			lines << 'soundCategory_master:0.0'
			f.text = lines.join('\n') + '\n'
		}
	}

	processResources {
		inputs.property 'version', project.version
		filesMatching('fabric.mod.json') {
			expand 'version': project.version,
				'mod_id': project.mod_id,
				'mod_name': project.mod_name,
				'mod_description': project.mod_description
		}
		// D78: the game rule group title shows the mod version
		filesMatching('assets/*/lang/*.json') {
			filter { line -> line.replace('@MOD_VERSION@', project.version.toString()) }
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = 25
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}
